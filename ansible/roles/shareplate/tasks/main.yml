---
- name: Check Docker installation
  ansible.builtin.command: docker --version
  changed_when: false

- name: Check Docker Compose installation
  ansible.builtin.command: docker compose version
  changed_when: false

- name: Ensure Docker daemon is running
  ansible.builtin.service:
    name: docker
    state: started

- name: Create SharePlate deployment directory
  ansible.builtin.file:
    path: "{{ project_directory }}"
    state: directory
    mode: "0755"

- name: Create deployment subdirectories
  ansible.builtin.file:
    path: "{{ project_directory }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - backend
    - frontend

- name: Copy deployment Compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../docker-compose.yml"
    dest: "{{ project_directory }}/{{ compose_file }}"
    mode: "0644"

- name: Create backend environment file
  ansible.builtin.template:
    src: backend.env.j2
    dest: "{{ project_directory }}/backend/.env"
    mode: "0600"
  no_log: true

- name: Select the scanned image tag for Compose
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ project_directory }}/.env"
    mode: "0600"

- name: Transfer scanned Docker images to production
  ansible.builtin.copy:
    src: "{{ image_archive }}"
    dest: "{{ remote_image_archive }}"
    mode: "0600"

- name: Load scanned Docker images
  ansible.builtin.command:
    cmd: "docker load --input {{ remote_image_archive }}"
  register: image_load
  changed_when: "'Loaded image' in image_load.stdout"

- name: Stop previous SharePlate containers
  ansible.builtin.command:
    cmd: "{{ compose_command }} -f {{ compose_file }} down"
    chdir: "{{ project_directory }}"
  changed_when: true

- name: Start containers from scanned images
  ansible.builtin.command:
    cmd: "{{ compose_command }} -f {{ compose_file }} up -d --no-build"
    chdir: "{{ project_directory }}"
  changed_when: true

- name: Remove transferred image archive
  ansible.builtin.file:
    path: "{{ remote_image_archive }}"
    state: absent

- name: Wait for SharePlate backend
  ansible.builtin.uri:
    url: "{{ backend_health_url }}"
    status_code: 200
  register: backend_health
  until: backend_health.status == 200
  retries: 12
  delay: 5

- name: Wait for SharePlate frontend
  ansible.builtin.uri:
    url: "{{ frontend_health_url }}"
    status_code: 200
  register: frontend_health
  until: frontend_health.status == 200
  retries: 12
  delay: 5

- name: Read running containers
  ansible.builtin.command: docker ps
  register: containers
  changed_when: false

- name: Display running containers
  ansible.builtin.debug:
    var: containers.stdout_lines
