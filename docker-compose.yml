version: "3.8"

services:
  # ----------------------------------------
  # SERVICE 1: The Express Node.js Backend
  # ----------------------------------------
  backend:
    build:
      context: ./backend      # Tells Compose to look in the /backend folder for Ahmad's Dockerfile
    container_name: shareplate-backend
    ports:
      - "5000:5000"           # Maps your VM's port 5000 to the container's port 5000
    env_file:
      - ./backend/.env        # Securely injects your MongoDB URI and Gemini API key
    restart: unless-stopped   # If the backend crashes, automatically restart it

  # ----------------------------------------
  # SERVICE 2: The React Frontend
  # ----------------------------------------
  frontend:
    build:
      context: ./frontend     # Tells Compose to look in the /frontend folder for Ahmad's Dockerfile
    container_name: shareplate-frontend
    ports:
      - "3000:3000"           # Maps your VM's port 3000 to the container's port 3000
    env_file:
      - ./frontend/.env       # Injects the REACT_APP_API_URL we created earlier
    depends_on:
      - backend               # Ensures the backend boots up BEFORE the frontend
    restart: unless-stopped   # Keeps the UI online even if the container restarts