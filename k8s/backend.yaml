apiVersion: apps/v1
kind: Deployment
metadata:
  name: shareplate-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shareplate-backend
  template:
    metadata:
      labels:
        app: shareplate-backend
    spec:
      containers:
      - name: backend
        image: shareplate-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: backend-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: shareplate-backend
  ports:
  - port: 5000
    targetPort: 5000