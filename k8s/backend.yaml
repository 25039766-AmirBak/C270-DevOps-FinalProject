apiVersion: apps/v1
kind: Deployment
metadata:
  name: shareplate-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shareplate-backend
  template:
    metadata:
      labels:
        app: shareplate-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: backend
        image: shareplate-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: backend-secrets
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
      volumes:
      - name: uploads
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: shareplate-backend
  ports:
  - port: 5000
    targetPort: 5000