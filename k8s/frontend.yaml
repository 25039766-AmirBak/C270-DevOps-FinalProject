apiVersion: apps/v1
kind: Deployment
metadata:
  name: shareplate-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shareplate-frontend
  template:
    metadata:
      labels:
        app: shareplate-frontend
    spec:
      containers:
      - name: frontend
        image: shareplate-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: shareplate-frontend
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000